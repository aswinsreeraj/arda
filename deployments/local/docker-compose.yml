services:
  postgres:
    image: postgres:16-alpine
    container_name: arda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arda}
      POSTGRES_USER: ${POSTGRES_USER:-arda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arda_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arda_user} -d ${POSTGRES_DB:-arda}" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  migrate:
    image: migrate/migrate:v4.18.2
    container_name: arda-migrate
    profiles:
      - tools
    volumes:
      - ../../migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-arda_user}:${POSTGRES_PASSWORD:-arda_password}@postgres:5432/${POSTGRES_DB:-arda}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  vault:
    image: hashicorp/vault:1.15
    container_name: arda-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: [ "CMD", "vault", "status", "-address=http://127.0.0.1:8200" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: arda-temporal
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-arda_user}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-arda_password}
      - POSTGRES_SEEDS=postgres
    #     - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - temporal operator cluster health --address "$$(hostname -i | awk '{print $$1}'):7233"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: arda-temporal-ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:8233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres_data:
    name: arda_postgres_data
